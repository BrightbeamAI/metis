id: review_summary
purpose: review_summary
description: Draft a Tier-2 review summary for the Mission Group. Never the decision.
system: "You draft review summaries for human Mission Group assessment. You never make the decision."
template: |
  Draft a concise review summary for Mission Group Tier-2 assessment of this fragment.
  Note any safety, quality, compliance, fairness, or surveillance risks you observe.
  Return JSON {"summary": "...", "risks_noted": ["..."]}.
  Fragment: {fragment}
  Evidence: {evidence}
output_format: json
notes:
  - "The Mission Group makes the decision; this is only a drafting aid."
