<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-label="Work as imagined: reduce load only when the alarm threshold is crossed (SOP-17). Work as done: ease back earlier, when high load meets a dull sound (an experienced operator, night shift)." font-family="'Zalando Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Work as imagined and work as done</title><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA0A8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1000" height="410" rx="20" fill="#282829"/><rect x="32" y="32" width="456" height="300" rx="10" fill="#F4F5F7"/><text x="60" y="78" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#3C3C3D" letter-spacing="0.8">WORK AS IMAGINED</text><text x="60" y="118" font-size="22" font-weight="600" fill="#282829"><tspan x="60">Reduce load only when the</tspan><tspan x="60" dy="30">alarm threshold is crossed.</tspan></text><text x="60" y="183" font-size="15" fill="#717070">SOP-17</text><path d="M60 252 H452" stroke="#9AA0A8" stroke-width="2" marker-end="url(#arr)"/><circle cx="344" cy="252" r="9" fill="#ffffff" stroke="#3C3C3D" stroke-width="2.5"/><text x="344" y="290" font-size="15" fill="#3C3C3D" text-anchor="middle">Alarm threshold</text><rect x="512" y="32" width="456" height="300" rx="10" fill="#FFF6F0"/><text x="540" y="78" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#EA4700" letter-spacing="0.8">WORK AS DONE</text><text x="540" y="118" font-size="22" font-weight="600" fill="#282829"><tspan x="540">Ease back earlier, when high</tspan><tspan x="540" dy="30">load meets a dull sound.</tspan></text><text x="540" y="183" font-size="15" fill="#717070">An experienced operator, night shift</text><path d="M540 252 H932" stroke="#9AA0A8" stroke-width="2" marker-end="url(#arr)"/><rect x="584" y="241" width="240" height="22" rx="11" fill="#FFDCC8"/><circle cx="584" cy="252" r="9" fill="#EA4700"/><circle cx="824" cy="252" r="9" fill="#FFF6F0" stroke="#3C3C3D" stroke-width="2" stroke-dasharray="3 3"/><text x="584" y="290" font-size="15" fill="#EA4700" text-anchor="middle">Earlier action</text><text x="824" y="290" font-size="15" fill="#3C3C3D" text-anchor="middle">Alarm threshold</text><text x="500" y="378" font-size="18" fill="#E8E6E3" text-anchor="middle">Metis records what the expert noticed, the context, and the response, for people to review.</text></svg>
