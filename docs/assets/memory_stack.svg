<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Memory broker and the four memory stores">
  <defs>
    <linearGradient id="ember2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EA4700"/><stop offset="1" stop-color="#FF9900"/>
    </linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A5A5A"/>
    </marker>
  </defs>
  <rect width="920" height="330" fill="#F2F5FA"/>
  <text x="28" y="38" font-size="20" font-weight="bold" fill="#282829">Four memory stores, one agent context</text>
  <text x="28" y="60" font-size="13" fill="#5A5A5A">Tacit memory is the only store reached through a governance gate.</text>

  <!-- three open stores -->
  <g>
    <rect x="28" y="84" width="220" height="46" rx="9" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.5"/>
    <text x="44" y="106" font-size="13" font-weight="bold" fill="#282829">Procedural</text>
    <text x="44" y="123" font-size="11" fill="#5A5A5A">SOPs, checklists, policies</text>

    <rect x="28" y="140" width="220" height="46" rx="9" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.5"/>
    <text x="44" y="162" font-size="13" font-weight="bold" fill="#282829">Semantic</text>
    <text x="44" y="179" font-size="11" fill="#5A5A5A">facts, equipment metadata</text>

    <rect x="28" y="196" width="220" height="46" rx="9" fill="#FFFFFF" stroke="#5A5A5A" stroke-width="1.5"/>
    <text x="44" y="218" font-size="13" font-weight="bold" fill="#282829">Episodic</text>
    <text x="44" y="235" font-size="11" fill="#5A5A5A">past cases, incidents</text>
  </g>

  <!-- tacit store + gate -->
  <rect x="28" y="252" width="220" height="50" rx="9" fill="url(#ember2)"/>
  <text x="44" y="274" font-size="13" font-weight="bold" fill="#FFFFFF">Tacit (fourth stratum)</text>
  <text x="44" y="291" font-size="11" fill="#FFFFFF">validated situated guidance</text>

  <rect x="330" y="246" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#EA4700" stroke-width="2.5"/>
  <text x="405" y="272" font-size="13" font-weight="bold" fill="#EA4700" text-anchor="middle">Retrieval</text>
  <text x="405" y="290" font-size="13" font-weight="bold" fill="#EA4700" text-anchor="middle">gate</text>

  <!-- broker -->
  <rect x="330" y="120" width="150" height="92" rx="10" fill="#282829"/>
  <text x="405" y="160" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Memory</text>
  <text x="405" y="180" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Broker</text>

  <!-- agent context -->
  <rect x="560" y="120" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#EA4700" stroke-width="2"/>
  <text x="660" y="150" font-size="14" font-weight="bold" fill="#282829" text-anchor="middle">Agent Memory</text>
  <text x="660" y="169" font-size="14" font-weight="bold" fill="#282829" text-anchor="middle">Context</text>
  <text x="660" y="194" font-size="11" fill="#5A5A5A" text-anchor="middle">procedural + semantic</text>
  <text x="660" y="210" font-size="11" fill="#5A5A5A" text-anchor="middle">+ episodic + tacit</text>
  <text x="660" y="226" font-size="11" fill="#5A5A5A" text-anchor="middle">+ use constraints</text>

  <!-- arrows: open stores straight to broker -->
  <line x1="248" y1="107" x2="330" y2="150" stroke="#5A5A5A" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="248" y1="163" x2="330" y2="166" stroke="#5A5A5A" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="248" y1="219" x2="330" y2="182" stroke="#5A5A5A" stroke-width="2" marker-end="url(#a2)"/>
  <!-- tacit store -> gate -> broker -->
  <line x1="248" y1="277" x2="330" y2="277" stroke="#EA4700" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="405" y1="246" x2="405" y2="212" stroke="#EA4700" stroke-width="2.5" marker-end="url(#a2)"/>
  <!-- broker -> agent context -->
  <line x1="480" y1="166" x2="560" y2="178" stroke="#5A5A5A" stroke-width="2" marker-end="url(#a2)"/>
  <!-- agent -->
  <line x1="760" y1="180" x2="828" y2="180" stroke="#5A5A5A" stroke-width="2" marker-end="url(#a2)"/>
  <text x="845" y="176" font-size="13" font-weight="bold" fill="#282829" text-anchor="middle">AI</text>
  <text x="845" y="192" font-size="13" font-weight="bold" fill="#282829" text-anchor="middle">agent</text>
</svg>
