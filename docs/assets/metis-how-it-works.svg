<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="How it works: 1 capture, the worker confirms the account; 2 human review, two named reviewers decide what the fragment may do; 3 use in context, the agent receives it when the conditions match. Three permission levels: Evidence, Advisory, Controlled." font-family="'Zalando Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" color="#282829"><title>How it works</title><defs><symbol id="g-workerL" viewBox="-24 -50 48 70" overflow="visible"><path d="M-14 -30a14 14 0 0 1 28 0v2h-28z" fill="#ff9900"/><rect x="-17" y="-30" width="34" height="5" rx="2.5" fill="#ff9900"/><circle cx="0" cy="-22" r="11" fill="#fff" stroke="#282829" stroke-width="3"/><path d="M-19 14c0-14 8-23 19-23s19 9 19 23v6h-38z" fill="#fff" stroke="#282829" stroke-width="3" stroke-linejoin="round"/><path d="M-13 -2c3 5 6 8 13 8s10-3 13-8" fill="none" stroke="#ff9900" stroke-width="4" stroke-linecap="round"/></symbol><symbol id="g-person" viewBox="-24 -50 48 70" overflow="visible"><circle cx="0" cy="-22" r="11" fill="#fff" stroke="#282829" stroke-width="3"/><path d="M-19 14c0-14 8-23 19-23s19 9 19 23v6h-38z" fill="#fff" stroke="#282829" stroke-width="3" stroke-linejoin="round"/><path d="M-13 -2c3 5 6 8 13 8s10-3 13-8" fill="none" stroke="#8a8d92" stroke-width="4" stroke-linecap="round"/></symbol><symbol id="g-gate" viewBox="-36 -36 72 72" overflow="visible"><path d="M0 -32 L32 0 L0 32 L-32 0z" fill="#ebf7ef" stroke="#238047" stroke-width="3.5"/><path d="M-12 0l8 8 16-16" fill="none" stroke="#238047" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="g-cube" viewBox="-30 -30 60 60" overflow="visible"><path d="M0 -26 L26 -12 L26 14 L0 28 L-26 14 L-26 -12z" fill="#ea4700"/><path d="M0 -26 L26 -12 L0 2 L-26 -12z" fill="#ff7a3a"/><path d="M0 2 L26 -12 L26 14 L0 28z" fill="#c23a00"/></symbol><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9z" fill="#989da6"/></marker><marker id="arrE" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1.5 L10.5 6 L1 10.5 Q3.5 6 1 1.5z" fill="#ea4700"/></marker></defs><rect width="1000" height="480" rx="20" fill="#F4F6F9"/><g fill="#ffffff" stroke="#e1e4e9" stroke-width="2"><rect x="32" y="32" width="296" height="300" rx="14"/><rect x="352" y="32" width="296" height="300" rx="14"/><rect x="672" y="32" width="296" height="300" rx="14"/></g><g stroke="#bbc0c8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"><path d="M331 182 H346"/><path d="M651 182 H666"/></g><g font-size="24" font-weight="700" fill="#282829"><circle cx="70" cy="70" r="18" fill="#fff0e5" stroke="#ea4700" stroke-width="2.5"/><text x="70" y="78" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="20" font-weight="650" fill="#b43e0a" text-anchor="middle">1</text><text x="100" y="79">Capture</text><circle cx="390" cy="70" r="18" fill="#fff0e5" stroke="#ea4700" stroke-width="2.5"/><text x="390" y="78" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="20" font-weight="650" fill="#b43e0a" text-anchor="middle">2</text><text x="420" y="79">Human review</text><circle cx="710" cy="70" r="18" fill="#fff0e5" stroke="#ea4700" stroke-width="2.5"/><text x="710" y="78" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="20" font-weight="650" fill="#b43e0a" text-anchor="middle">3</text><text x="740" y="79">Use in context</text></g><use href="#g-workerL" x="62" y="112" width="70" height="102"/><path d="M150 132 h146 a10 10 0 0 1 10 10 v40 a10 10 0 0 1 -10 10 h-118 l-14 14 v-14 h-14 a10 10 0 0 1 -10 -10 v-40 a10 10 0 0 1 10 -10z" fill="#fff0e5" stroke="#ea4700" stroke-width="2"/><text x="224" y="156" font-size="15" fill="#282829" text-anchor="middle"><tspan x="224">What cue made</tspan><tspan x="224" dy="19">you pause?</tspan></text><use href="#g-person" x="420" y="118" width="62" height="92"/><use href="#g-person" x="518" y="118" width="62" height="92"/><circle cx="500" cy="122" r="17" fill="#238047"/><path d="M492 122l5.5 5.5 11-11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><use href="#g-gate" x="742" y="134" width="64" height="64"/><path d="M806 166 H842" stroke="#ea4700" stroke-width="4" stroke-linecap="round" marker-end="url(#arrE)"/><use href="#g-cube" x="850" y="122" width="88" height="88"/><g font-size="17" fill="#4a4d52"><text x="56" y="262"><tspan x="56">The worker confirms the</tspan><tspan x="56" dy="24">account in their own words.</tspan></text><text x="376" y="262"><tspan x="376">Two named reviewers decide</tspan><tspan x="376" dy="24">what the fragment may do.</tspan></text><text x="696" y="262"><tspan x="696">The agent receives it when</tspan><tspan x="696" dy="24">its conditions match.</tspan></text></g><text x="32" y="372" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#717070" letter-spacing="0.8">THREE PERMISSION LEVELS</text><g><rect x="32" y="388" width="296" height="60" rx="10" fill="#ffffff" stroke="#e1e4e9" stroke-width="2"/><rect x="32" y="388" width="8" height="60" rx="4" fill="#8a8d92"/><text x="58" y="414" font-size="18" font-weight="700" fill="#282829">Evidence</text><text x="58" y="436" font-size="15" fill="#717070">reviewers only</text><rect x="352" y="388" width="296" height="60" rx="10" fill="#ffffff" stroke="#e1e4e9" stroke-width="2"/><rect x="352" y="388" width="8" height="60" rx="4" fill="#ff9900"/><text x="378" y="414" font-size="18" font-weight="700" fill="#282829">Advisory</text><text x="378" y="436" font-size="15" fill="#717070">conditional support</text><rect x="672" y="388" width="296" height="60" rx="10" fill="#ffffff" stroke="#e1e4e9" stroke-width="2"/><rect x="672" y="388" width="8" height="60" rx="4" fill="#ea4700"/><text x="698" y="414" font-size="18" font-weight="700" fill="#282829">Controlled</text><text x="698" y="436" font-size="15" fill="#717070">formal instruction</text></g></svg>
