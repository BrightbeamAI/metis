{{- $postgres := include "metis.usesPostgres" . -}}
{{- if and (gt (int .Values.replicaCount) 1) (not $postgres) }}
{{- fail "replicaCount > 1 needs PostgreSQL: set database.url or database.existingSecret" }}
{{- end }}
{{- if not (or .Values.oidc.issuer .Values.apiKeys.existingSecret .Values.trustedProxy.existingSecret) }}
{{- fail "Configure sign-in: oidc.issuer, apiKeys.existingSecret, or trustedProxy.existingSecret" }}
{{- end }}
{{- if and (not $postgres) (not .Values.persistence.enabled) (not .Values.persistence.acknowledgeEphemeral) }}
{{- fail "SQLite without persistence loses every workspace when the pod goes: enable persistence, use PostgreSQL, or set persistence.acknowledgeEphemeral=true" }}
{{- end }}
{{- if and .Values.migrations.runAsJob (not $postgres) }}
{{- fail "migrations.runAsJob needs PostgreSQL" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metis.fullname" . }}
  labels:
    {{- include "metis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if not $postgres }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "metis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "metis.selectorLabels" . | nindent 8 }}
      {{- $checksum := and .Values.database.url (not .Values.database.existingSecret) }}
      {{- if or $checksum .Values.podAnnotations }}
      annotations:
        {{- if $checksum }}
        # roll the pods when the chart's own Secret changes; for your Secrets, restart them
        checksum/database: {{ .Values.database.url | sha256sum | trunc 16 | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "metis.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: metis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- if $postgres }}
            - name: METIS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "metis.databaseSecret" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else }}
            - name: METIS_DATABASE_URL
              value: sqlite:////data/metis.db
            {{- end }}
            {{- if .Values.oidc.issuer }}
            - name: METIS_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: METIS_OIDC_AUDIENCE
              value: {{ .Values.oidc.audience | quote }}
            - name: METIS_OIDC_ROLES_CLAIM
              value: {{ .Values.oidc.rolesClaim | quote }}
            - name: METIS_OIDC_EMAIL_CLAIM
              value: {{ .Values.oidc.emailClaim | quote }}
            - name: METIS_OIDC_NAME_CLAIM
              value: {{ .Values.oidc.nameClaim | quote }}
            - name: METIS_OIDC_REQUIRE_EMAIL_VERIFIED
              value: {{ .Values.oidc.requireEmailVerified | quote }}
            {{- with .Values.oidc.participantClaim }}
            - name: METIS_OIDC_PARTICIPANT_CLAIM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.jwksUrl }}
            - name: METIS_OIDC_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            # The global role names, for OIDC roles and for the groups a trusted proxy forwards.
            - name: METIS_OIDC_ADMIN_ROLE
              value: {{ .Values.oidc.adminRole | quote }}
            - name: METIS_OIDC_AUDITOR_ROLE
              value: {{ .Values.oidc.auditorRole | quote }}
            {{- if .Values.apiKeys.existingSecret }}
            - name: METIS_API_KEYS_FILE
              value: /config/api-keys/{{ .Values.apiKeys.existingSecretKey }}
            {{- end }}
            {{- if .Values.trustedProxy.existingSecret }}
            - name: METIS_TRUSTED_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.trustedProxy.existingSecret }}
                  key: {{ .Values.trustedProxy.existingSecretKey }}
            {{- end }}
            {{- with .Values.admins }}
            - name: METIS_ADMINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.corsOrigins }}
            - name: METIS_CORS_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.publicUrl }}
            - name: METIS_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ui.clientId }}
            - name: METIS_UI_CLIENT_ID
              value: {{ . | quote }}
            - name: METIS_UI_SCOPES
              value: {{ $.Values.ui.scopes | quote }}
            {{- end }}
            {{- if .Values.notifications.existingSecret }}
            - name: METIS_NOTIFICATIONS_FILE
              value: /config/notifications/{{ .Values.notifications.existingSecretKey }}
            {{- end }}
            {{- if .Values.connectors.existingSecret }}
            - name: METIS_CONNECTORS_FILE
              value: /config/connectors/{{ .Values.connectors.existingSecretKey }}
            {{- end }}
            {{- with .Values.slack.existingSecret }}
            - name: METIS_SLACK_BOT_TOKEN
              valueFrom: {secretKeyRef: {name: {{ . }}, key: bot-token}}
            - name: METIS_SLACK_SIGNING_SECRET
              valueFrom: {secretKeyRef: {name: {{ . }}, key: signing-secret}}
            {{- end }}
            {{- with .Values.teams.existingSecret }}
            - name: METIS_TEAMS_APP_ID
              valueFrom: {secretKeyRef: {name: {{ . }}, key: app-id}}
            - name: METIS_TEAMS_APP_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ . }}, key: app-password}}
            - name: METIS_TEAMS_TENANT_ID
              valueFrom: {secretKeyRef: {name: {{ . }}, key: tenant-id, optional: true}}
            {{- end }}
            {{- with .Values.teams.allowedTenants }}
            - name: METIS_TEAMS_ALLOWED_TENANTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.teams.serviceHosts }}
            - name: METIS_TEAMS_SERVICE_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: METIS_SWEEP_INTERVAL_SECONDS
              value: {{ int64 .Values.sweepIntervalSeconds | quote }}
            - name: METIS_DISPATCH_INTERVAL_SECONDS
              value: {{ int64 .Values.dispatchIntervalSeconds | quote }}
            - name: METIS_WHISPER_DEADLINE_HOURS
              value: {{ int64 .Values.whisperDeadlineHours | quote }}
            - name: METIS_USE_LIVE_MODEL
              value: {{ .Values.useLiveModel | quote }}
            {{- with .Values.model.url }}
            - name: METIS_MODEL_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.model.name }}
            - name: METIS_MODEL_NAME
              value: {{ . | quote }}
            {{- end }}
            - name: METIS_ESCALATION_GRANT_HOURS
              value: {{ .Values.escalationGrantHours | quote }}
            - name: METIS_OUTBOX_RETENTION_DAYS
              value: {{ int64 .Values.outboxRetentionDays | quote }}
            - name: METIS_MAX_BODY_BYTES
              value: {{ int64 .Values.limits.maxBodyBytes | quote }}
            - name: METIS_LOCK_TIMEOUT_SECONDS
              value: {{ int64 .Values.limits.lockTimeoutSeconds | quote }}
            - name: METIS_STATEMENT_TIMEOUT_SECONDS
              value: {{ int64 .Values.limits.statementTimeoutSeconds | quote }}
            - name: METIS_DB_POOL_SIZE
              value: {{ int64 .Values.database.poolSize | quote }}
            - name: METIS_DB_MAX_OVERFLOW
              value: {{ int64 .Values.database.maxOverflow | quote }}
            - name: METIS_MIGRATE_ON_START
              value: {{ (not .Values.migrations.runAsJob) | quote }}
            - name: METIS_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:  # the schema is checked or migrated before the port opens
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if .Values.preStopSleepSeconds }}
          lifecycle:
            preStop:
              exec:
                command: ["python", "-c", "import time; time.sleep({{ int .Values.preStopSleepSeconds }})"]
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            {{- if .Values.apiKeys.existingSecret }}
            - name: api-keys
              mountPath: /config/api-keys
              readOnly: true
            {{- end }}
            {{- if .Values.notifications.existingSecret }}
            - name: notifications
              mountPath: /config/notifications
              readOnly: true
            {{- end }}
            {{- if .Values.connectors.existingSecret }}
            - name: connectors
              mountPath: /config/connectors
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if and (not $postgres) .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "metis.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.apiKeys.existingSecret }}
        - name: api-keys
          secret:
            secretName: {{ .Values.apiKeys.existingSecret }}
        {{- end }}
        {{- if .Values.notifications.existingSecret }}
        - name: notifications
          secret:
            secretName: {{ .Values.notifications.existingSecret }}
        {{- end }}
        {{- if .Values.connectors.existingSecret }}
        - name: connectors
          secret:
            secretName: {{ .Values.connectors.existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if and .Values.spreadReplicas (gt (int .Values.replicaCount) 1) }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "metis.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
