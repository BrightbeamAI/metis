# Values for the Metis server chart. See deploy/README.md.

nameOverride: ""
fullnameOverride: ""

image:
  # Build the image from the repository's Dockerfile and push it to your registry.
  repository: metis-server
  tag: ""          # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# More than one replica needs PostgreSQL: workspaces then serialise their writers through
# PostgreSQL advisory locks. With SQLite, run one replica with persistence enabled.
replicaCount: 1

database:
  # A PostgreSQL URL, for example postgresql://metis:password@postgres:5432/metis.
  # Prefer existingSecret; a URL given here is stored in a Secret the chart creates.
  url: ""
  existingSecret: ""
  existingSecretKey: database-url
  poolSize: 5
  maxOverflow: 10

# Schema migrations. By default each pod migrates on start (safe with several replicas). With
# runAsJob, a pre-install and pre-upgrade Job runs `metis server migrate` and the pods only
# check the schema, so the pods' database role needs no right to change tables. PostgreSQL only.
migrations:
  runAsJob: false
  # A Secret with the URL of a role that owns the tables, for the Job; the database Secret
  # when empty.
  existingSecret: ""
  existingSecretKey: database-url
  # The servers' own database role (the one in database.existingSecret): each migration grants
  # it what it needs and no more, so it can only append to the evidence ledger.
  appRole: ""

# Sign-in. Configure OIDC, API keys, a trusted proxy, or a combination.
oidc:
  issuer: ""                   # for example https://login.example.com/realms/metis
  audience: metis-api
  jwksUrl: ""                  # discovered from the issuer when empty
  rolesClaim: roles            # Keycloak: realm_access.roles
  emailClaim: email
  nameClaim: name
  adminRole: metis-admin       # also the group name a trusted proxy forwards
  auditorRole: metis-auditor
  requireEmailVerified: false  # name people by email only when the token marks it verified
  participantClaim: ""         # a claim that may name the participant URI; off when empty

apiKeys:
  # A Secret holding the API keys file, created with `metis server api-key create --file`.
  # Keys added to the Secret take effect when Kubernetes refreshes the mounted file.
  existingSecret: ""
  existingSecretKey: api-keys.yaml

trustedProxy:
  # A Secret holding the shared secret that your authenticating proxy sends.
  existingSecret: ""
  existingSecretKey: proxy-secret

# Participant URIs that hold the global admin role, for example human:ana@example.com.
admins: []

# The address people use to reach Metis; notifications link to its web app (/app).
publicUrl: ""

# The web app signs people in with this public OIDC client (authorization code with PKCE).
# Register its redirect URI as <publicUrl>/app and give its tokens the API audience.
ui:
  clientId: ""
  scopes: "openid profile email"

notifications:
  # A Secret holding a notifications file (see docs/server.md). Secrets the file names with
  # *_env come from extraEnv, for example from another Secret.
  existingSecret: ""
  existingSecretKey: notifications.yaml

connectors:
  # A Secret holding the source mappings file (docs/connectors.md).
  existingSecret: ""
  existingSecretKey: connectors.yaml

# Whispers in chat tools. Each names a Secret holding the credentials.
slack:
  existingSecret: ""        # keys: bot-token, signing-secret
teams:
  existingSecret: ""        # keys: app-id, app-password, and optionally tenant-id
  # The Microsoft Entra tenants whose people may use the bot (besides tenant-id).
  allowedTenants: []
  serviceHosts: []          # Bot Framework hosts; the public and government clouds by default

# Background work: lapsing overdue whispers, review-date notices, and delivering notifications.
sweepIntervalSeconds: 300
dispatchIntervalSeconds: 5
outboxRetentionDays: 30     # delivered and failed notifications are cleared after this
corsOrigins: []
whisperDeadlineHours: 168
escalationGrantHours: 12    # how long a person's decision on an escalated situation holds
logLevel: info
extraEnv: []

# The local model (Ollama) for drafting, for example a Service in the cluster.
useLiveModel: false
model:
  url: ""                   # for example http://ollama:11434
  name: ""                  # gemma4 when empty

limits:
  maxBodyBytes: 4194304     # larger request bodies get 413; set your ingress to the same
  lockTimeoutSeconds: 30    # a workspace busy longer answers 503 with Retry-After
  statementTimeoutSeconds: 60

# Storage for SQLite, when no database URL is given. The volume holds the evidence chain, so
# `helm uninstall` keeps it (delete the claim yourself). Without persistence the chart refuses
# to render unless acknowledgeEphemeral is true: everything is lost when the pod goes.
persistence:
  enabled: true
  keepOnUninstall: true
  acknowledgeEphemeral: false
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

# With several replicas: keep one running during voluntary disruptions, and spread them out.
podDisruptionBudget:
  minAvailable: 1
spreadReplicas: true
terminationGracePeriodSeconds: 40
preStopSleepSeconds: 5      # lets the Service stop routing before shutdown begins

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: metis.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
