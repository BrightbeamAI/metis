[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metis-memory"
version = "0.1.1"
description = "A CHAP-aligned, local-first toolkit for capturing, validating, governing, and retrieving tacit fragments as governed tacit memory for AI agents."
readme = "README_PYPI.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Brightbeam AI", email = "oss@brightbeam.ai" }]
keywords = ["tacit-knowledge", "governance", "agentic-ai", "memory", "chap", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "chap-coordinator>=0.2.9",
  "pydantic>=2.5",
  "typer>=0.9",
  "PyYAML>=6.0",
  "cryptography>=41.0",
  "httpx>=0.24",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.23"]
dev = ["pytest>=7", "ruff>=0.4", "jsonschema>=4", "fastapi>=0.110", "uvicorn>=0.23", "build>=1", "twine>=5"]

[project.scripts]
metis = "metis.cli.main:main"

[project.urls]
Homepage = "https://github.com/BrightbeamAI/metis"
Documentation = "https://github.com/BrightbeamAI/metis/tree/main/docs"
"CHAP protocol" = "https://github.com/BrightbeamAI/chap"
Paper = "https://www.preprints.org/manuscript/202608.0927"

[tool.setuptools.packages.find]
include = ["metis*"]

[tool.setuptools.package-data]
"metis" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
