name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,api]"
      - name: Lint
        run: ruff check tacitflow tests scripts
      - name: Test
        run: pytest
      - name: Demo runs without a live model
        run: tacitflow demo manufacturing-pump-vibration
